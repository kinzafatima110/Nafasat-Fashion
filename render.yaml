services:
  - type: web
    name: nafasat-catalogue
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: nafasat2026!
      - key: SECRET_KEY
        generateValue: true
